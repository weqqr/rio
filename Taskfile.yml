version: '3'

vars:
  CUSTOM_GCL: '{{if eq OS "windows"}}./bin/custom-gcl.exe{{else}}./bin/custom-gcl{{end}}'

tasks:
  run:
    desc: Run the application
    cmds:
      - go run .
  test:
    desc: Run all tests
    cmds:
      - go test ./...
  lint:
    desc: Lint the code
    cmds:
      - golangci-lint custom
      - '{{.CUSTOM_GCL}} run ./...'
  ci:
    desc: Run lint and tests in parallel
    deps: [lint, test]
